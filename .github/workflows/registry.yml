name: Research omnibus
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - run: make install
      - run: make test
      - run: make workbench
  rust-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.1 fmt --manifest-path tools/evidence-explorer/Cargo.toml -- --check
      - run: cargo +1.98.1 clippy --manifest-path tools/evidence-explorer/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.98.1 test --manifest-path tools/evidence-explorer/Cargo.toml --locked
      - run: cargo +1.98.1 build --manifest-path tools/evidence-explorer/Cargo.toml --locked
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/evidence-explorer/tests/package_roundtrip.py
