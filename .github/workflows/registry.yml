name: Research omnibus
on: [push, pull_request]
permissions:
  contents: read
# Superseded pushes to the same ref are cancelled; only the latest gets a full run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - run: make install
      - run: make test
      - run: make workbench
      # Report known high/critical advisories without gating, like the container
      # template's Docker Scout step. Flip continue-on-error to make it a gate.
      - name: Dependency advisories (report, non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for app in apps/registry apps/landing; do
            echo "::group::npm audit $app"
            (cd "$app" && npm audit --audit-level=high) || status=1
            echo "::endgroup::"
          done
          if [[ $status -ne 0 ]]; then echo "::warning::npm audit reported high/critical advisories"; fi
          exit $status
  rust-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.98.1 fmt --manifest-path tools/evidence-explorer/Cargo.toml -- --check
      - run: cargo +1.98.1 clippy --manifest-path tools/evidence-explorer/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo +1.98.1 test --manifest-path tools/evidence-explorer/Cargo.toml --locked
      - run: cargo +1.98.1 build --manifest-path tools/evidence-explorer/Cargo.toml --locked
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tools/evidence-explorer/tests/package_roundtrip.py
  # Reference implementation for the intercept-hook spec v1.1 (docs/reviews/…).
  # Core is tested natively; the Workers adapter is linted for wasm32. The e2e
  # smoke (reference/e2e/smoke.py) needs wrangler dev and is run by hand.
  icih-reference:
    runs-on: ubuntu-latest
    env:
      MANIFEST: docs/reviews/informed-consent-intercept-hook/reference/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - run: cargo +1.98.1 fmt --manifest-path "$MANIFEST" --all -- --check
      - run: cargo +1.98.1 test --manifest-path "$MANIFEST" --locked -p icih-core
      - run: cargo +1.98.1 clippy --manifest-path "$MANIFEST" --locked -p icih-core --all-targets -- -D warnings
      - run: cargo +1.98.1 clippy --manifest-path "$MANIFEST" --locked -p icih-worker --target wasm32-unknown-unknown -- -D warnings
