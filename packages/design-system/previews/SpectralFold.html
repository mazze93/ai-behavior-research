<!-- @dsCard group="Illustration" height=760 subtitle="Live · from apps/landing" -->
<div id="root" style="padding:20px;max-width:560px"></div>
<script>
var CP = window.CharcoalPorcelain, h = React.createElement;
function App() {
  var [study, setStudy] = React.useState('overview');
  return h('div', null, h(CP.SpectralFold, { id: 'fold-preview', study }),
    h('div', { className: 'study-switcher', role: 'group', 'aria-label': 'Choose a study illustration' },
      [['overview', 'Index'], ['identity-dissolution', '01 / Identity'], ['persona-integrity', '02 / Persona']].map(([id, label]) =>
        h('button', { key: id, type: 'button', 'aria-pressed': study === id, onClick: () => setStudy(id) }, label))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
