# Informed-Consent Intercept Hook v1.1 — Rust Worker (draft, NOT deployed).
#
# Deployment prerequisites (deliberately absent from this file):
#   SIGNER_PUBLIC_KEY  the harness's Ed25519 public key, 64 lowercase hex.
#                      Set per deployment: `wrangler secret put SIGNER_PUBLIC_KEY`
#                      (not secret, but keeps it out of the repo). Missing or
#                      malformed => every attestation is refused.
#   BOUNDARIES_KV      no `id` here: Wrangler provisions the namespace on first
#                      deploy. Consent a zone with
#                      `wrangler kv key put --remote --binding=BOUNDARIES_KV "zone:https://host:443" "true"`
name = "icih-egress"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-27"
workers_dev = false
preview_urls = false

[build]
command = "worker-build --release"

[vars]
# Upper bounds only: the Worker never accepts a looser value than its
# compiled defaults (300 s age, 60 s skew).
MAX_ENVELOPE_AGE_SECS = "300"
MAX_CLOCK_SKEW_SECS = "60"

[[kv_namespaces]]
binding = "BOUNDARIES_KV"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "Session"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Session"]
