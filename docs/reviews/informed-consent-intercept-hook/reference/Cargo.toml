# Reference implementation for spec v1.1.0 (../spec-v1.1.0.md).
# icih-core is pure decision logic, tested natively; icih-worker is the
# Cloudflare Workers adapter, compiled for wasm32-unknown-unknown.
[workspace]
members = ["icih-core", "icih-worker"]
resolver = "2"

[workspace.package]
version = "1.1.0-draft"
edition = "2021"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = "s"
lto = true
